name: Windows build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: W_TB_MS-v${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/W_TB_MS-v${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/W_TB_MS-v${{ steps.version.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error

      - name: Create GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts/W_TB_MS-v${{ steps.version.outputs.version }}-win-x64.zip" `
            "artifacts/W_TB_MS-v${{ steps.version.outputs.version }}-win-x64.zip.sha256" `
            --title "W_TB_MS ${{ github.ref_name }}" `
            --generate-notes

